<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Agent Customization — Knowledge Sharing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --ink:#0e1020;
    --muted:#5a5f72;
    --blue:#3b6cf5;
    --teal:#14b8a6;
    --orange:#f97316;
    --rose:#f43f5e;
    --lime:#84cc16;
    --amber:#f59e0b;
    --red:#ef4444;
    --green:#22c55e;
    --purple:#8b5cf6;
    --hairline:#e8eaf2;
    --accent-blue-purple:linear-gradient(135deg,#3b6cf5 0%,#8b5cf6 100%);
    --accent-teal-purple:linear-gradient(135deg,#14b8a6 0%,#3b6cf5 60%,#8b5cf6 100%);
    --accent-hooks:linear-gradient(135deg,#3b6cf5 0%,#14b8a6 55%,#f97316 100%);
    --accent-context:linear-gradient(135deg,#f43f5e 0%,#f97316 52%,#3b6cf5 100%);
    --accent-codegraph:linear-gradient(135deg,#2563eb 0%,#14b8a6 52%,#84cc16 100%);
    --accent-artifacts:linear-gradient(135deg,#8b5cf6 0%,#3b6cf5 50%,#f59e0b 100%);
    --accent-plan:linear-gradient(135deg,#2563eb 0%,#ef4444 100%);
    --accent-cli:linear-gradient(135deg,#2563eb 0%,#22c55e 50%,#ef4444 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    overflow:hidden;
  }
  .deck{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    touch-action:pan-y pinch-zoom;
  }
  .slide{
    width:100%;
    height:100%;
    position:absolute;
    top:0;left:0;
    display:grid;
    grid-template-columns:0.72fr 1.8fr;
    padding:48px 44px;
    gap:12px;
    opacity:0;
    pointer-events:none;
    transform:scale(0.98);
    transition:opacity .5s ease, transform .5s ease;
  }
  .slide.active{
    opacity:1;
    pointer-events:auto;
    transform:scale(1);
  }
  .left{
    max-width:520px;
  }

  /* faint grid backdrop */
  .slide::before{
    content:"";
    position:absolute;inset:0;
    background-image:
      linear-gradient(to right, rgba(59,108,245,0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(59,108,245,0.04) 1px, transparent 1px);
    background-size:56px 56px;
    pointer-events:none;
    mask-image:radial-gradient(ellipse at 30% 40%, #000 30%, transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse at 30% 40%, #000 30%, transparent 75%);
  }

  /* eyebrow chip */
  .eyebrow{
    display:inline-flex;align-items:center;gap:12px;
    font-family:'JetBrains Mono',monospace;
    font-size:14px;letter-spacing:0.14em;
    font-weight:500;
    text-transform:uppercase;
    margin-bottom:30px;
    position:relative;z-index:2;
  }
  .slide-1 .eyebrow { color:var(--blue); }
  .slide-2 .eyebrow { color:var(--teal); }
  .slide-3 .eyebrow { color:var(--orange); }
  .slide-4 .eyebrow { color:var(--rose); }
  .slide-5 .eyebrow { color:var(--lime); }
  .slide-6 .eyebrow { color:var(--amber); }
  .slide-7 .eyebrow { color:var(--red); }
  .slide-8 .eyebrow { color:var(--green); }
  
  .eyebrow .dot{
    width:10px;height:10px;border-radius:50%;
    box-shadow:0 0 0 4px rgba(139,92,246,0.12);
  }
  .slide-1 .eyebrow .dot { background:var(--accent-blue-purple); box-shadow:0 0 0 4px rgba(59,108,245,0.12); }
  .slide-2 .eyebrow .dot { background:var(--accent-teal-purple); box-shadow:0 0 0 4px rgba(20,184,166,0.15); }
  .slide-3 .eyebrow .dot { background:var(--accent-hooks); box-shadow:0 0 0 4px rgba(249,115,22,0.14); }
  .slide-4 .eyebrow .dot { background:var(--accent-context); box-shadow:0 0 0 4px rgba(244,63,94,0.14); }
  .slide-5 .eyebrow .dot { background:var(--accent-codegraph); box-shadow:0 0 0 4px rgba(132,204,22,0.14); }
  .slide-6 .eyebrow .dot { background:var(--accent-artifacts); box-shadow:0 0 0 4px rgba(245,158,11,0.14); }
  .slide-7 .eyebrow .dot { background:var(--accent-plan); box-shadow:0 0 0 4px rgba(239,68,68,0.14); }
  .slide-8 .eyebrow .dot { background:var(--accent-cli); box-shadow:0 0 0 4px rgba(34,197,94,0.14); }
  
  .eyebrow .slash{color:#c9cde0}

  h1.title{
    font-weight:800;
    font-size:clamp(46px,4.4vw,70px);
    line-height:1.1;
    letter-spacing:-0.025em;
    color:var(--ink);
    position:relative;z-index:2;
    max-width:14ch;
  }
  .slide-1 h1.title{
    font-size:clamp(34px,3.2vw,54px);
    max-width:18ch;
  }
  h1.title .file{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    letter-spacing:-0.02em;
  }
  .slide-1 h1.title .file { background:var(--accent-blue-purple); -webkit-background-clip:text; background-clip:text; }
  .slide-2 h1.title .file { background:var(--accent-teal-purple); -webkit-background-clip:text; background-clip:text; }
  .slide-3 h1.title .file { background:var(--accent-hooks); -webkit-background-clip:text; background-clip:text; }
  .slide-4 h1.title .file { background:var(--accent-context); -webkit-background-clip:text; background-clip:text; }
  .slide-5 h1.title .file { background:var(--accent-codegraph); -webkit-background-clip:text; background-clip:text; }
  .slide-6 h1.title .file { background:var(--accent-artifacts); -webkit-background-clip:text; background-clip:text; }
  .slide-7 h1.title .file { background:var(--accent-plan); -webkit-background-clip:text; background-clip:text; }
  .slide-8 h1.title .file { background:var(--accent-cli); -webkit-background-clip:text; background-clip:text; }

  .title-rule{
    width:116px;height:4px;
    border-radius:3px;
    margin:34px 0 34px;
    position:relative;z-index:2;
  }
  .slide-1 .title-rule { background:var(--accent-blue-purple); }
  .slide-2 .title-rule { background:var(--accent-teal-purple); }
  .slide-3 .title-rule { background:var(--accent-hooks); }
  .slide-4 .title-rule { background:var(--accent-context); }
  .slide-5 .title-rule { background:var(--accent-codegraph); }
  .slide-6 .title-rule { background:var(--accent-artifacts); }
  .slide-7 .title-rule { background:var(--accent-plan); }
  .slide-8 .title-rule { background:var(--accent-cli); }

  .points{
    list-style:none;
    display:flex;flex-direction:column;gap:18px;
    position:relative;z-index:2;
    max-width:40ch;
    padding-left:18px;
  }
  .points::before{
    content:"";
    position:absolute;
    top:6px;
    bottom:6px;
    left:0;
    width:3px;
    border-radius:999px;
  }
  .slide-1 .points::before { background:linear-gradient(to bottom,rgba(59,108,245,0.15),rgba(59,108,245,0.58),rgba(139,92,246,0.42),rgba(59,108,245,0.15)); }
  .slide-2 .points::before { background:linear-gradient(to bottom,rgba(20,184,166,0.15),rgba(20,184,166,0.58),rgba(59,108,245,0.42),rgba(139,92,246,0.15)); }
  .slide-3 .points::before { background:linear-gradient(to bottom,rgba(59,108,245,0.15),rgba(20,184,166,0.48),rgba(249,115,22,0.52),rgba(249,115,22,0.15)); }
  .slide-4 .points::before { background:linear-gradient(to bottom,rgba(244,63,94,0.15),rgba(244,63,94,0.56),rgba(249,115,22,0.44),rgba(59,108,245,0.15)); }
  .slide-5 .points::before { background:linear-gradient(to bottom,rgba(37,99,235,0.15),rgba(20,184,166,0.54),rgba(132,204,22,0.46),rgba(132,204,22,0.15)); }
  .slide-6 .points::before { background:linear-gradient(to bottom,rgba(139,92,246,0.15),rgba(59,108,245,0.48),rgba(245,158,11,0.52),rgba(245,158,11,0.15)); }
  .slide-7 .points::before { background:linear-gradient(to bottom,rgba(37,99,235,0.15),rgba(37,99,235,0.48),rgba(239,68,68,0.56),rgba(239,68,68,0.15)); }
  .slide-8 .points::before { background:linear-gradient(to bottom,rgba(37,99,235,0.15),rgba(34,197,94,0.52),rgba(239,68,68,0.44),rgba(239,68,68,0.15)); }
  }
  .points li{
    display:flex;align-items:center;gap:18px;
    padding:18px 22px 18px 18px;
    border:1px solid var(--hairline);
    border-radius:12px;
    background:#fff;
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .points li:hover{
    transform:translateY(-1px);
    border-color:#d7dbf0;
  }
  .slide-1 .points li:hover { box-shadow:0 8px 22px -14px rgba(59,108,245,0.45); }
  .slide-2 .points li:hover { box-shadow:0 8px 22px -14px rgba(20,184,166,0.45); }
  .slide-3 .points li:hover { box-shadow:0 8px 22px -14px rgba(249,115,22,0.42); }
  .slide-4 .points li:hover { box-shadow:0 8px 22px -14px rgba(244,63,94,0.42); }
  .slide-5 .points li:hover { box-shadow:0 8px 22px -14px rgba(132,204,22,0.42); }
  .slide-6 .points li:hover { box-shadow:0 8px 22px -14px rgba(245,158,11,0.42); }
  .slide-7 .points li:hover { box-shadow:0 8px 22px -14px rgba(239,68,68,0.42); }
  .slide-8 .points li:hover { box-shadow:0 8px 22px -14px rgba(34,197,94,0.42); }
  
  .points .num{
    flex:none;
    width:36px;height:36px;border-radius:9px;
    display:grid;place-items:center;
    font-family:'JetBrains Mono',monospace;
    font-size:15px;font-weight:600;color:#fff;
  }
  .slide-1 .points .num { background:var(--accent-blue-purple); box-shadow:0 4px 10px -4px rgba(139,92,246,0.5); }
  .slide-2 .points .num { background:var(--accent-teal-purple); box-shadow:0 4px 10px -4px rgba(59,108,245,0.5); }
  .slide-3 .points .num { background:var(--accent-hooks); box-shadow:0 4px 10px -4px rgba(249,115,22,0.5); }
  .slide-4 .points .num { background:var(--accent-context); box-shadow:0 4px 10px -4px rgba(244,63,94,0.5); }
  .slide-5 .points .num { background:var(--accent-codegraph); box-shadow:0 4px 10px -4px rgba(132,204,22,0.5); }
  .slide-6 .points .num { background:var(--accent-artifacts); box-shadow:0 4px 10px -4px rgba(245,158,11,0.5); }
  .slide-7 .points .num { background:var(--accent-plan); box-shadow:0 4px 10px -4px rgba(239,68,68,0.5); }
  .slide-8 .points .num { background:var(--accent-cli); box-shadow:0 4px 10px -4px rgba(34,197,94,0.5); }
  
  .points .label{
    font-size:20px;font-weight:700;color:var(--ink);
    line-height:1.3;
    letter-spacing:-0.005em;
  }
  .points .sub{
    display:block;
    font-size:12px;font-weight:400;color:var(--muted);
    margin-top:3px;letter-spacing:0.01em;
  }

  /* RIGHT: image stage */
  .stage{
    position:relative;z-index:2;
    display:flex;align-items:center;justify-content:flex-start;
  }
  .stage .frame{
    position:relative;
    width:min(72vw,1460px);
    max-width:none;
    border-radius:18px;
    background:#fff;
    padding:12px;
    border:1px solid var(--hairline);
  }
  .slide-1 .stage .frame {
    box-shadow:0 30px 60px -30px rgba(59,108,245,0.25), 0 12px 24px -18px rgba(139,92,246,0.18);
  }
  .slide-2 .stage .frame {
    box-shadow:0 30px 60px -30px rgba(20,184,166,0.25), 0 12px 24px -18px rgba(139,92,246,0.18);
  }
  .slide-3 .stage .frame {
    box-shadow:0 30px 60px -30px rgba(59,108,245,0.22), 0 12px 24px -18px rgba(249,115,22,0.18);
  }
  .slide-4 .stage .frame {
    box-shadow:0 30px 60px -30px rgba(244,63,94,0.22), 0 12px 24px -18px rgba(59,108,245,0.18);
  }
  .slide-5 .stage .frame {
    box-shadow:0 30px 60px -30px rgba(37,99,235,0.22), 0 12px 24px -18px rgba(132,204,22,0.18);
  }
  .slide-6 .stage .frame {
    box-shadow:0 30px 60px -30px rgba(139,92,246,0.22), 0 12px 24px -18px rgba(245,158,11,0.18);
  }
  .slide-7 .stage .frame {
    box-shadow:0 30px 60px -30px rgba(37,99,235,0.22), 0 12px 24px -18px rgba(239,68,68,0.18);
  }
  .slide-8 .stage .frame {
    box-shadow:0 30px 60px -30px rgba(37,99,235,0.22), 0 12px 24px -18px rgba(34,197,94,0.18);
  }
  .stage .frame::before{
    content:"";
    position:absolute;inset:-1px;
    border-radius:18px;
    padding:1px;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    pointer-events:none;
  }
  .slide-1 .stage .frame::before { background:linear-gradient(135deg,rgba(59,108,245,0.6),rgba(139,92,246,0.6),transparent 60%); }
  .slide-2 .stage .frame::before { background:linear-gradient(135deg,rgba(20,184,166,0.6),rgba(59,108,245,0.6),rgba(139,92,246,0.6)); }
  .slide-3 .stage .frame::before { background:linear-gradient(135deg,rgba(59,108,245,0.55),rgba(20,184,166,0.55),rgba(249,115,22,0.5)); }
  .slide-4 .stage .frame::before { background:linear-gradient(135deg,rgba(244,63,94,0.55),rgba(249,115,22,0.5),rgba(59,108,245,0.48)); }
  .slide-5 .stage .frame::before { background:linear-gradient(135deg,rgba(37,99,235,0.55),rgba(20,184,166,0.55),rgba(132,204,22,0.5)); }
  .slide-6 .stage .frame::before { background:linear-gradient(135deg,rgba(139,92,246,0.55),rgba(59,108,245,0.5),rgba(245,158,11,0.48)); }
  .slide-7 .stage .frame::before { background:linear-gradient(135deg,rgba(37,99,235,0.55),rgba(239,68,68,0.5),transparent 65%); }
  .slide-8 .stage .frame::before { background:linear-gradient(135deg,rgba(37,99,235,0.55),rgba(34,197,94,0.5),rgba(239,68,68,0.45)); }
  
  .stage img{
    display:block;width:100%;height:auto;
    max-height:calc(100vh - 140px);
    object-fit:contain;
    border-radius:10px;
  }
  /* floating badge */
  .badge{
    position:absolute;
    top:-14px;right:18px;
    background:#fff;
    border:1px solid var(--hairline);
    border-radius:999px;
    padding:6px 12px;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;letter-spacing:0.08em;
    font-weight:600;
  }
  .slide-1 .badge { color:var(--purple); box-shadow:0 6px 18px -10px rgba(139,92,246,0.5); }
  .slide-2 .badge { color:var(--blue); box-shadow:0 6px 18px -10px rgba(59,108,245,0.5); }
  .slide-3 .badge { color:var(--orange); box-shadow:0 6px 18px -10px rgba(249,115,22,0.5); }
  .slide-4 .badge { color:var(--rose); box-shadow:0 6px 18px -10px rgba(244,63,94,0.5); }
  .slide-5 .badge { color:var(--teal); box-shadow:0 6px 18px -10px rgba(20,184,166,0.5); }
  .slide-6 .badge { color:var(--amber); box-shadow:0 6px 18px -10px rgba(245,158,11,0.5); }
  .slide-7 .badge { color:var(--red); box-shadow:0 6px 18px -10px rgba(239,68,68,0.5); }
  .slide-8 .badge { color:var(--green); box-shadow:0 6px 18px -10px rgba(34,197,94,0.5); }
  
  .badge .pulse{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    margin-right:8px;vertical-align:middle;
  }
  .slide-1 .badge .pulse { background:var(--purple); box-shadow:0 0 0 3px rgba(139,92,246,0.18); }
  .slide-2 .badge .pulse { background:var(--teal); box-shadow:0 0 0 3px rgba(20,184,166,0.2); }
  .slide-3 .badge .pulse { background:var(--orange); box-shadow:0 0 0 3px rgba(249,115,22,0.18); }
  .slide-4 .badge .pulse { background:var(--orange); box-shadow:0 0 0 3px rgba(249,115,22,0.18); }
  .slide-5 .badge .pulse { background:var(--lime); box-shadow:0 0 0 3px rgba(132,204,22,0.18); }
  .slide-6 .badge .pulse { background:var(--amber); box-shadow:0 0 0 3px rgba(245,158,11,0.18); }
  .slide-7 .badge .pulse { background:var(--red); box-shadow:0 0 0 3px rgba(239,68,68,0.18); }
  .slide-8 .badge .pulse { background:var(--green); box-shadow:0 0 0 3px rgba(34,197,94,0.18); }

  /* intro slide */
  .intro-slide{
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:56px 72px;
    gap:42px;
  }
  .intro-slide .intro-kicker{
    position:relative;z-index:2;
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    letter-spacing:0.16em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .intro-slide .intro-title{
    position:relative;z-index:2;
    max-width:980px;
    font-size:clamp(56px,6vw,96px);
    line-height:0.98;
    letter-spacing:-0.035em;
    color:var(--ink);
  }
  .intro-slide .intro-title span{
    background:var(--accent-blue-purple);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .topic-grid{
    position:relative;z-index:2;
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:14px;
    max-width:1500px;
  }
  .topic-chip{
    min-height:112px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    border:1px solid var(--hairline);
    border-radius:14px;
    background:#fff;
    padding:16px;
    box-shadow:0 16px 32px -28px rgba(14,16,32,0.35);
  }
  .topic-chip .num{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    font-weight:700;
    color:#fff;
    width:34px;
    height:34px;
    display:grid;
    place-items:center;
    border-radius:9px;
  }
  .topic-chip .name{
    font-size:19px;
    font-weight:800;
    line-height:1.15;
    letter-spacing:-0.01em;
  }
  .topic-agents .num,.topic-agents .name{background:var(--accent-blue-purple);-webkit-background-clip:text;background-clip:text;color:transparent}
  .topic-skills .num,.topic-skills .name{background:var(--accent-teal-purple);-webkit-background-clip:text;background-clip:text;color:transparent}
  .topic-hooks .num,.topic-hooks .name{background:var(--accent-hooks);-webkit-background-clip:text;background-clip:text;color:transparent}
  .topic-context .num,.topic-context .name{background:var(--accent-context);-webkit-background-clip:text;background-clip:text;color:transparent}
  .topic-cli .num,.topic-cli .name{background:var(--accent-cli);-webkit-background-clip:text;background-clip:text;color:transparent}
  .topic-codegraph .num,.topic-codegraph .name{background:var(--accent-codegraph);-webkit-background-clip:text;background-clip:text;color:transparent}
  .topic-artifacts .num,.topic-artifacts .name{background:var(--accent-artifacts);-webkit-background-clip:text;background-clip:text;color:transparent}
  .topic-plan .num,.topic-plan .name{background:var(--accent-plan);-webkit-background-clip:text;background-clip:text;color:transparent}
  .topic-chip .num{
    -webkit-background-clip:border-box;
    background-clip:border-box;
    color:#fff;
  }
  .conclusion-slide{
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:72px;
    gap:36px;
  }
  .conclusion-slide .intro-kicker{
    position:relative;z-index:2;
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    letter-spacing:0.16em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .conclusion-slide .intro-title{
    position:relative;z-index:2;
    max-width:1050px;
    font-size:clamp(58px,6.5vw,104px);
    line-height:0.98;
    letter-spacing:-0.035em;
    color:var(--ink);
  }
  .conclusion-slide .intro-title span{
    background:linear-gradient(135deg,#3b6cf5 0%,#14b8a6 42%,#f97316 74%,#ef4444 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .takeaway-list{
    position:relative;z-index:2;
    list-style:none;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:18px;
    max-width:1280px;
  }
  .takeaway-list li{
    min-height:126px;
    display:flex;
    align-items:flex-end;
    border:1px solid var(--hairline);
    border-radius:14px;
    background:#fff;
    padding:22px;
    font-size:24px;
    font-weight:800;
    line-height:1.15;
    letter-spacing:-0.015em;
    box-shadow:0 16px 32px -28px rgba(14,16,32,0.35);
  }
  .takeaway-list li:nth-child(1){color:var(--blue)}
  .takeaway-list li:nth-child(2){color:var(--teal)}
  .takeaway-list li:nth-child(3){color:var(--orange)}
  .questions{
    position:relative;z-index:2;
    margin-top:10px;
    font-family:'JetBrains Mono',monospace;
    font-size:22px;
    font-weight:700;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
  }

  /* footer */
  .footer{
    position:absolute;
    left:72px;right:72px;bottom:20px;
    display:flex;justify-content:space-between;align-items:flex-end;
    font-size:10px;color:#a0a4b8;
    font-family:'JetBrains Mono',monospace;
    letter-spacing:0.03em;
    z-index:3;
    gap:24px;
  }
  .footer .src{
    display:flex;flex-direction:column;gap:2px;
    max-width:75ch;
  }
  .footer .src a{
    color:#a0a4b8;text-decoration:none;
    border-bottom:1px dotted #c8ccdc;
    word-break:break-all;
  }
  .footer .src a:hover{color:var(--blue)}
  .footer .page{color:#c1c5d4;white-space:nowrap;}

  /* Navigation Controls */
  .nav-controls {
    position: fixed;
    inset: 0;
    z-index: 100;
    pointer-events: none;
  }
  .nav-btn {
    position: absolute;
    top: 50%;
    width: 64px;
    height: 112px;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--blue);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    font-weight: 300;
    opacity: 0.22;
    pointer-events: auto;
    transform: translateY(-50%);
    transition: opacity 0.2s ease, background 0.2s ease;
  }
  #prevBtn { left: 8px; }
  #nextBtn { right: 8px; }
  .nav-btn:hover,
  .nav-btn:focus-visible {
    color: var(--blue);
    opacity: 0.55;
    background: rgba(255,255,255,0.72);
    outline: none;
  }
  .nav-btn:active { opacity: 0.8; }
  .nav-btn[hidden] {
    display: none;
  }

  @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
    .deck,
    .nav-controls {
      position: absolute;
      top: 0;
      right: auto;
      bottom: auto;
      left: 100vw;
      width: 100vh;
      height: 100vw;
      transform: rotate(90deg);
      transform-origin: top left;
    }
  }

  /* entrance animations */
  .slide.active .reveal{opacity:0;transform:translateY(10px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
  .slide.active .reveal.d1{animation-delay:.1s}
  .slide.active .reveal.d2{animation-delay:.23s}
  .slide.active .reveal.d3{animation-delay:.35s}
  .slide.active .reveal.d4{animation-delay:.47s}
  .slide.active .reveal.d5{animation-delay:.59s}
  .slide.active .stage.reveal{animation-delay:.35s;animation-name:riseImg}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  @keyframes riseImg{from{opacity:0;transform:scale(.98) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}

</style>
</head>
<body>

<div class="deck" id="deck"></div>

<!-- Navigation Controls -->
<div class="nav-controls">
  <button class="nav-btn" id="prevBtn" aria-label="Previous slide" onclick="changeSlide(-1)">‹</button>
  <button class="nav-btn" id="nextBtn" aria-label="Next slide" onclick="changeSlide(1)">›</button>
</div>

<script>
  window.slides = [];
</script>
<!-- Add a new slide by creating slides/03-name.js and adding one script tag here. -->
<script src="slides/00-intro.js"></script>
<script src="slides/01-agents.js"></script>
<script src="slides/02-skills.js"></script>
<script src="slides/03-hooks.js"></script>
<script src="slides/04-context-hygiene.js"></script>
<script src="slides/05-cli-tools.js"></script>
<script src="slides/06-codegraph.js"></script>
<script src="slides/07-artifacts.js"></script>
<script src="slides/08-plan-review.js"></script>
<script src="slides/09-conclusion.js"></script>
<script>
  let currentSlide = 1;
  let totalSlides = window.slides.length;

  function updateNavigationControls() {
    document.getElementById("prevBtn").hidden = currentSlide <= 1;
    document.getElementById("nextBtn").hidden = currentSlide >= totalSlides;
  }

  function renderSlides() {
    const deck = document.getElementById("deck");
    deck.innerHTML = window.slides.join("\n");
    const slides = [...deck.querySelectorAll(".slide")];
    totalSlides = slides.length;
    currentSlide = 1;

    slides.forEach((slide, index) => {
      const slideNumber = index + 1;
      slide.id = "slide-" + slideNumber;
      slide.classList.toggle("active", slideNumber === currentSlide);

      const page = slide.querySelector(".page");
      if (page) {
        page.textContent = String(slideNumber).padStart(2, "0") + " / " + String(totalSlides).padStart(2, "0");
      }
    });

    updateNavigationControls();
  }

  function changeSlide(direction) {
    if (!totalSlides || !document.getElementById("slide-" + currentSlide)) return;

    let nextSlide = currentSlide + direction;

    if (nextSlide < 1 || nextSlide > totalSlides) return;

    document.getElementById("slide-" + currentSlide).classList.remove("active");
    document.getElementById("slide-" + nextSlide).classList.add("active");

    currentSlide = nextSlide;
    updateNavigationControls();
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === " ") {
      e.preventDefault();
      changeSlide(1);
    } else if (e.key === "ArrowLeft") {
      e.preventDefault();
      changeSlide(-1);
    }
  });

  let touchStartX = null;
  let touchStartY = null;

  const deck = document.getElementById("deck");

  deck.addEventListener("touchstart", (e) => {
    touchStartX = null;
    touchStartY = null;

    if (e.touches.length !== 1) return;

    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  deck.addEventListener("touchend", (e) => {
    if (touchStartX === null || touchStartY === null || !e.changedTouches.length) return;

    const horizontalDistance = e.changedTouches[0].clientX - touchStartX;
    const verticalDistance = e.changedTouches[0].clientY - touchStartY;

    touchStartX = null;
    touchStartY = null;

    const isRotatedPortrait = window.matchMedia("(orientation: portrait) and (hover: none) and (pointer: coarse)").matches;
    const useVerticalAxis = isRotatedPortrait
      && Math.abs(verticalDistance) > Math.abs(horizontalDistance);
    const swipeDistance = useVerticalAxis ? verticalDistance : horizontalDistance;

    if (Math.abs(swipeDistance) < 50
      || (!isRotatedPortrait && Math.abs(horizontalDistance) <= Math.abs(verticalDistance))) return;

    changeSlide(swipeDistance < 0 ? 1 : -1);
  }, { passive: true });

  deck.addEventListener("touchcancel", () => {
    touchStartX = null;
    touchStartY = null;
  });

  renderSlides();
</script>

</body>
</html>
